<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Function</title>
</head>
<body>

    <p id="Greeting">Click the button to change this text.</p>

    <button onclick="My_First_Function()">Click Me!</button>

    <script>
        function My_First_Function() {
            var String = "Hello! You clicked the button.";
            document.getElementById("Greeting").innerHTML = String;
        }
    </script>


<script src="Basic_JavaScript_1.js"></script>

</body>
</html>
